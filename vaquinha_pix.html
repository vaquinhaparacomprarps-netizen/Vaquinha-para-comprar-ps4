<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaquinha - Pix</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.card{background:#fff;width:100%;max-width:420px;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0001;text-align:center}
h1{margin:0 0 12px} p{color:#555}
.key{background:#f0f0f0;padding:14px;border-radius:10px;word-break:break-all;font-size:14px;margin:20px 0}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#16a34a;color:white;font-size:17px;font-weight:bold;cursor:pointer}
#msg{margin-top:12px;color:#16a34a;font-weight:bold;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h1>❤️ Ajude na vaquinha</h1>
<p>Qualquer contribuição pode ajudar. Para contribuir pelo Pix, toque no botão abaixo.</p>
<div class="key">79e43a69-6d70-479f-976b-35a039937a04</div>
<button onclick="copiarPix()">📋 COPIAR CHAVE PIX</button>
<div id="msg"></div>
</div>
<script>
async function copiarPix(){
 const chave="79e43a69-6d70-479f-976b-35a039937a04";
 try{
   await navigator.clipboard.writeText(chave);
   document.getElementById("msg").textContent="✅ Chave Pix copiada!";
 }catch(e){
   const t=document.createElement("textarea"); t.value=chave; document.body.appendChild(t);
   t.select(); document.execCommand("copy"); t.remove();
   document.getElementById("msg").textContent="✅ Chave Pix copiada!";
 }
}
</script>
</body>
</html>
